services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Publish Postgres to the host so scripts run from your machine
    # (e.g. `pnpm import-resume`) can reach it at localhost:5432. Bound to
    # loopback only: Docker's iptables rules bypass ufw, so a bare "5432:5432"
    # would expose the database on every interface of the VPS.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - personal-site-network

  # One-shot Payload schema migration. Runs to completion (exits 0) before the
  # app starts, applying src/migrations against Postgres. Uses the full-deps
  # `migrate` image stage (payload CLI + config + migrations), NOT the slim
  # runner. Owns production DB migrations — resolves the C1 migration risk.
  migrate:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: migrate
    # `payload migrate` prompts (and blocks on stdin) when the DB carries a
    # dev-push marker (a payload_migrations row with batch = -1, written by
    # `payload dev`). No CLI flag suppresses this for the `migrate` command
    # (only migrate:create / migrate:fresh honor --force-accept-warning), so we
    # pipe `y` to auto-confirm. Harmless on a clean prod DB: with no marker the
    # prompt never appears and the piped stdin is simply ignored. Keep prod
    # migration-authoritative — never run `payload dev` against the prod DB.
    command: sh -c "echo y | pnpm exec payload migrate"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URI: ${DATABASE_URI}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
    networks:
      - personal-site-network

  nextjs:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_FEATURE_MUSIC: ${NEXT_PUBLIC_FEATURE_MUSIC}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_FEATURE_MUSIC: ${NEXT_PUBLIC_FEATURE_MUSIC}
      DATABASE_URI: ${DATABASE_URI}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_MEDIA_DIR: /app/media
    volumes:
      - media:/app/media
    networks:
      - personal-site-network

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${UMAMI_DATABASE_URL}
      APP_SECRET: ${UMAMI_APP_SECRET}
    networks:
      - personal-site-network

  caddy:
    image: caddy:2-alpine
    depends_on:
      - nextjs
      - umami
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      - personal-site-network

networks:
  personal-site-network:
    driver: bridge

volumes:
  postgres_data:
  media:
  caddy_data:
